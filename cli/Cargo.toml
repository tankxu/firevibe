[package]
name = "firevibe-cli"
edition.workspace = true
version.workspace = true

[dependencies]
opus = "0.3"
hidapi = "2"
firevibe-core = { path = "../core" }
anyhow.workspace = true
libc = "0.2.189"

# 产物叫 firectl —— 跟 systemctl / kubectl 一个路子，「fire control」也贴题。
# 不叫 firevibe：会和 app 里的可执行文件同名，授权列表里分不清该勾哪个。
[[bin]]
name = "firectl"
path = "src/main.rs"
