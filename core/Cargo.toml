[package]
name = "firevibe-core"
edition.workspace = true
version.workspace = true

[dependencies]
flate2 = "1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
hidapi = "2"
cpal = "0.15"
opus = "0.3"
dirs = "5"
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "=0.10.0"
# 系统媒体键（音量 / 静音 / 播放 / 上下曲）走 NSEvent systemDefined，
# CGEvent 造不出这类事件，只能借 AppKit
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSGraphicsContext", "NSWorkspace", "NSRunningApplication", "objc2-core-graphics", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSView", "NSResponder", "NSApplication", "NSWindow", "NSImage", "NSPanel", "NSOpenPanel", "NSSavePanel"] }
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSURL", "NSLocale", "NSError", "NSArray", "NSObject", "NSData"] }
block2 = "0.6"
objc2-speech = { version = "0.3", features = [
    "SFSpeechRecognizer", "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["ioctl"] }
